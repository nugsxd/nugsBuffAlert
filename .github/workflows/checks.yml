name: checks

# Runs on every push, so the state of the code is visible without taking anybody's
# word for it. The same checks run locally before any release - see .tools/run.js.
on:
  push:
  pull_request:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
